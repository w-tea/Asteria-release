id: anima_txt2img_workflow
profile: anima
schema: schemas/anima_txt2img.yaml
builder: ComfyTxt2ImgWorkflowBuilder._build_anima
mode: txt2img
nodes:
  diffusion_loader: "1"
  text_encoder_loader: "2"
  vae_loader: "3"
  conditioning: "4"
  latent: "5"
  negative_conditioning: "6"
  sampler_tail_start: "7"
  qwen35_loader: "7"
  merge_source_b: "900"
  merge_source_c: "901"
  merge_runtime: "902"
class_types:
  unet_loader: UNETLoader
  text_encoder_loader: CLIPLoader
  vae_loader: VAELoader
  conditioning: TextEncodeQwenImageEdit
  qwen35_loader: AnimaQwen35Loader
  qwen35_unified_prompt: AnimaQwen35UnifiedPrompt
  native_text_encode: CLIPTextEncode
  anima_3_8b_latent: EmptySD3LatentImage
  latent: EmptyQwenImageLayeredLatentImage
  lora_loader: LoraLoader
  anima_lora_remap: AsteriaAnimaLoraRemap
  random_noise: RandomNoise
  basic_guider: BasicGuider
  cfg_guider: CFGGuider
  sampler_select: KSamplerSelect
  basic_scheduler: BasicScheduler
  sampler_custom: SamplerCustomAdvanced
  vae_decode: VAEDecode
  save_image: SaveImage
  latent_upscale: LatentUpscale
  latent_upscale_by: LatentUpscaleBy
  image_scale: ImageScale
  image_scale_by: ImageScaleBy
  upscale_model_loader: UpscaleModelLoader
  image_upscale_with_model: ImageUpscaleWithModel
  vae_encode: VAEEncode
  vae_encode_inpaint: VAEEncodeForInpaint
  load_image: LoadImage
  model_patch_loader: ModelPatchLoader
  anima_lllite_apply: AnimaLLLiteApply
  detailer_detector: UltralyticsDetectorProvider
  face_detailer: FaceDetailer
  merge_runtime: AsteriaAnimaMergeRuntime
  spatial_mask_collector: AsteriaSpatialMaskCollector
  spatial_token_binding: AsteriaSpatialTokenBinding
  spatial_guidance_adapter: AsteriaSpatialGuidanceAdapter
  spatial_guidance_sampler: AsteriaSpatialGuidanceSampler
  spatial_execution_receipt: AsteriaSpatialExecutionReceipt
node_contracts:
  spatial_mask_collector:
    required_inputs:
      - mask
      - target_id
      - depth_index
      - overlap_weight
      - strength
      - blending
      - mask_sha256
      - contract_version
    accepted_inputs:
      - previous
    outputs_by_index:
      0: ASTERIA_SPATIAL_MASK_BUNDLE
      1: STRING
  spatial_token_binding:
    required_inputs:
      - conditioning
      - clip
      - full_text
      - character_ranges_json
      - required_encoders_json
      - adapter_kind
      - step_start_percent
      - step_end_percent
      - contract_version
    outputs_by_index:
      0: CONDITIONING
      1: ASTERIA_SPATIAL_TOKEN_BINDING
      2: STRING
  spatial_guidance_adapter:
    required_inputs:
      - model
      - full_positive
      - negative
      - token_binding
      - masks
      - profile_json
      - stage
      - contract_version
    outputs_by_index:
      0: MODEL
      1: CONDITIONING
      2: CONDITIONING
      3: ASTERIA_SPATIAL_GUIDANCE_STATE
  spatial_guidance_sampler:
    required_inputs:
      - model
      - seed
      - steps
      - cfg
      - sampler_name
      - scheduler
      - positive
      - negative
      - latent_image
      - denoise
      - guidance_state
    outputs_by_index:
      0: LATENT
      1: ASTERIA_SPATIAL_GUIDANCE_STATE
  spatial_execution_receipt:
    required_inputs:
      - execution_state
      - samples
      - contract_version
    outputs_by_index:
      0: STRING
dynamic_sections:
  - hires_fix
  - img2img
  - inpaint
  - detailer_units
  - remaster
