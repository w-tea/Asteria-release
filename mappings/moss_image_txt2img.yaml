id: moss_image_txt2img_workflow
profile: moss_image
schema: schemas/moss_image_txt2img.yaml
builder: ComfyTxt2ImgWorkflowBuilder._build_native_image
mode: txt2img
nodes:
  unet_loader: "1"
  clip_loader: "2"
  vae_loader: "3"
  positive: "4"
  negative: "5"
  latent: "6"
  skip_layer_guidance: "7"
class_types:
  unet_loader: UNETLoader
  clip_loader: CLIPLoader
  vae_loader: VAELoader
  lora_loader: LoraLoader
  control_loader: AsteriaMossControlLoader
  control_lora_loader: AsteriaMossLoraLoader
  control_image: LoadImage
  control_map: AsteriaMossControlMap
  control_apply: AsteriaMossControlApply
  positive: CLIPTextEncode
  negative: CLIPTextEncode
  latent: EmptyFlux2LatentImage
  skip_layer_guidance: SkipLayerGuidanceDiTSimple
  random_noise: RandomNoise
  cfg_guider: CFGGuider
  sampler_select: KSamplerSelect
  basic_scheduler: BasicScheduler
  sampler_custom: SamplerCustomAdvanced
  vae_decode: VAEDecode
  image_crop: ImageCrop
  save_image: SaveImage
  generation_stage_save: AsteriaSaveGenerationStage
  generation_stage_load: AsteriaLoadGenerationStage
  generation_stage_sampler: AsteriaGenerationStageSampler
  generation_stage_noise: AsteriaSelectedGenerationNoise
  generation_stage_sample_filter: AsteriaSelectedGenerationSampler
node_contracts:
  clip_loader:
    required_inputs: [clip_name, type]
    required_input_values: {type: [moss_image]}
    outputs_by_index: {0: CLIP}
  skip_layer_guidance:
    required_inputs: [model, double_layers, single_layers, start_percent, end_percent]
    outputs_by_index: {0: MODEL}
dynamic_sections: [lora_stack]
