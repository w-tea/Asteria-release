id: sdxl_txt2img_workflow
profile: sdxl
schema: schemas/sdxl_txt2img.yaml
builder: ComfyTxt2ImgWorkflowBuilder._build_sdxl
mode: txt2img
nodes:
  checkpoint_loader: "1"
  clip_positive: "2"
  clip_negative: "3"
  latent: "4"
  sampler: "5"
  vae_loader: "6"
  vae_decode: "7"
  save_image: "9"
  merge_source_b: "900"
  merge_source_c: "901"
  merge_runtime: "902"
class_types:
  generation_stage_save: AsteriaSaveGenerationStage
  generation_branch_model: AsteriaGenerationBranchModel
  generation_stage_load: AsteriaLoadGenerationStage
  generation_stage_sampler: AsteriaGenerationStageSampler
  generation_stage_noise: AsteriaSelectedGenerationNoise
  generation_stage_sample_filter: AsteriaSelectedGenerationSampler
  checkpoint_loader: CheckpointLoaderSimple
  lora_loader: LoraLoader
  lora_block_weight_loader: LoraLoaderBlockWeight //Inspire
  clip_skip: CLIPSetLastLayer
  vae_loader: VAELoader
  load_image: LoadImage
  vae_encode: VAEEncode
  set_latent_noise_mask: SetLatentNoiseMask
  latent: EmptyLatentImage
  clip_text_encode: CLIPTextEncode
  clip_text_encode_sdxl: CLIPTextEncodeSDXL
  controlnet_loader: ControlNetLoader
  controlnet_apply: ControlNetApplyAdvanced
  controlnet_soft_weights: ACN_ScaledSoftControlNetWeights
  controlnet_advanced_apply: ACN_AdvancedControlNetApply_v2
  ksampler: KSampler
  ksampler_inspire: KSampler //Inspire
  ksampler_advanced_inspire: KSamplerAdvanced //Inspire
  seed_explorer: SeedExplorer //Inspire
  composite_noise: CompositeNoise //Inspire
  vae_decode: VAEDecode
  save_image: SaveImage
  latent_upscale: LatentUpscale
  latent_upscale_by: LatentUpscaleBy
  image_scale: ImageScale
  image_scale_by: ImageScaleBy
  upscale_model_loader: UpscaleModelLoader
  image_upscale_with_model: ImageUpscaleWithModel
  detailer_detector: UltralyticsDetectorProvider
  face_detailer: FaceDetailer
  merge_runtime: AsteriaSDXLMergeRuntime
  conditioning_time_range: ConditioningSetTimestepRange
  conditioning_combine: ConditioningCombine
  conditioning_multiply: ConditioningMultiply
  conditioning_concat: ConditioningConcat
  prompt_step_schedule: AsteriaPromptStepSchedule
  spatial_mask_collector: AsteriaSpatialMaskCollector
  spatial_full_text_binding: AsteriaSpatialFullTextBinding
  spatial_native_guidance: AsteriaSpatialNativeGuidance
  spatial_execution_receipt: AsteriaSpatialExecutionReceipt
node_contracts:
  spatial_mask_collector:
    required_inputs:
      - mask
      - target_id
      - depth_index
      - overlap_weight
      - strength
      - blending
      - mask_sha256
      - contract_version
    accepted_inputs:
      - previous
    outputs_by_index:
      0: ASTERIA_SPATIAL_MASK_BUNDLE
      1: STRING
  spatial_full_text_binding:
    required_inputs:
      - clip
      - source_positive
      - binding_json
      - family
      - contract_version
    outputs_by_index:
      0: CONDITIONING
      1: ASTERIA_SPATIAL_FULL_TEXT
      2: STRING
  spatial_native_guidance:
    required_inputs:
      - model
      - positive
      - negative
      - binding
      - masks
      - geometry_json
      - profile_json
      - stage
      - initial_noise_seed
      - contract_version
    outputs_by_index:
      0: MODEL
      1: CONDITIONING
      2: CONDITIONING
      3: ASTERIA_SPATIAL_GUIDANCE_STATE
  spatial_execution_receipt:
    required_inputs:
      - execution_state
      - samples
      - contract_version
    outputs_by_index:
      0: STRING
  conditioning_time_range:
    required_inputs:
      - conditioning
      - start
      - end
    outputs_by_index:
      0: CONDITIONING
  conditioning_combine:
    required_inputs:
      - conditioning_1
      - conditioning_2
    outputs_by_index:
      0: CONDITIONING
  conditioning_multiply:
    required_inputs:
      - conditioning
      - multiplier
    outputs_by_index:
      0: CONDITIONING
  conditioning_concat:
    required_inputs:
      - conditioning_to
      - conditioning_from
    outputs_by_index:
      0: CONDITIONING
  prompt_step_schedule:
    required_inputs:
      - model
      - conditioning_a
      - conditioning_b
      - steps
      - sampler_name
      - scheduler
      - denoise
    outputs_by_index:
      0: CONDITIONING
  controlnet_soft_weights:
    required_inputs:
      - base_multiplier
    accepted_inputs:
      - uncond_multiplier
    outputs_by_index:
      0: CONTROL_NET_WEIGHTS
  controlnet_advanced_apply:
    required_inputs:
      - positive
      - negative
      - control_net
      - image
      - strength
      - start_percent
      - end_percent
    accepted_inputs:
      - weights_override
      - vae_optional
  seed_explorer:
    required_inputs:
      - latent
      - seed_prompt
      - enable_additional
      - additional_seed
      - additional_strength
      - noise_mode
      - initial_batch_seed_mode
    required_input_values:
      noise_mode:
        - GPU(=A1111)
      initial_batch_seed_mode:
        - incremental
    outputs_by_index:
      0: NOISE_IMAGE
  composite_noise:
    required_inputs:
      - destination
      - source
      - mode
      - x
      - y
    required_input_values:
      mode:
        - center
    outputs_by_index:
      0: NOISE_IMAGE
  ksampler_advanced_inspire:
    required_inputs:
      - model
      - add_noise
      - noise_seed
      - steps
      - cfg
      - sampler_name
      - scheduler
      - positive
      - negative
      - latent_image
      - start_at_step
      - end_at_step
      - noise_mode
      - return_with_leftover_noise
      - batch_seed_mode
      - variation_seed
      - variation_strength
    accepted_inputs:
      - noise_opt
      - internal_seed
    required_input_values:
      noise_mode:
        - GPU+internal_seed
      batch_seed_mode:
        - incremental
    outputs_by_index:
      0: LATENT
dynamic_sections:
  - lora_stack
  - controlnet_units
  - hires_fix
  - detailer_units
  - remaster
  - seed_resize
