profiles:
  - id: sdxl
    label: SDXL / Illustrious
    prompt_syntax:
      grammar: asteria-prompt-v1
      features:
        - token_weight
        - scheduled_switch
        - alternating_switch
        - conditioning_and
        - conditioning_break
    dependency_ids:
      - sdxl-checkpoint
      - sdxl-vae
      - sdxl-controlnet-canny-xinsir
      - sdxl-controlnet-depth-xinsir
      - sdxl-controlnet-tile-xinsir
      - sdxl-controlnet-openpose-xinsir
    model_slots:
      - id: checkpoint
        label: Checkpoint
        type: checkpoint
        required: true
      - id: vae
        label: VAE
        type: vae
        required: true
    setting_groups:
      - base_generation
      - sdxl_model
      - lora
      - controlnet
      - detailer
      - hires_fix
      - topaz

  - id: anima
    label: Anima
    prompt_syntax:
      grammar: asteria-prompt-v1
      features: []
    dependency_ids:
      - anima-base-v1
      - anima-text-encoder
      - anima-vae
      - anima-lllite-regional-controlnet
    model_slots:
      - id: diffusion_model
        label: Anima Transformer
        type: checkpoint
        required: true
      - id: text_encoder
        label: Text Encoder
        type: text_encoder
        required: true
      - id: qwen35_text_encoder
        label: Qwen3.5 4B Text Encoder (Anima 3.8B)
        type: text_encoder
        required: false
      - id: progressive_adapter
        label: Progressive Adapter (Anima 3.8B)
        type: text_encoder
        required: false
      - id: vae
        label: VAE
        type: vae
        required: true
    managed_model_bundles:
      - id: anima-3.8b-official
        variant: anima_3_8b_52
        components:
          diffusion_model: anima-3.8b-diffusion
          text_encoder: anima-text-encoder
          qwen35_text_encoder: anima-3.8b-qwen35
          progressive_adapter: anima-3.8b-progressive-adapter
          vae: anima-vae
    setting_groups:
      - base_generation
      - anima_runtime
      - lora
      - controlnet
      - detailer
      - hires_fix
      - topaz

  - id: flux1
    label: Flux.1
    prompt_syntax:
      grammar: asteria-prompt-v1
      features: []
    dependency_ids:
      - flux-model
      - flux-clip-l
      - flux-t5xxl
      - flux-vae
    model_slots:
      - id: diffusion_model
        label: Flux.1 Transformer
        type: checkpoint
        required: true
      - id: clip_l
        label: CLIP-L
        type: text_encoder
        required: true
      - id: t5xxl
        label: T5-XXL
        type: text_encoder
        required: true
      - id: vae
        label: VAE
        type: vae
        required: true
    setting_groups:
      - base_generation
      - flux_runtime
      - controlnet
      - detailer
      - hires_fix
      - topaz

  - id: flux2
    label: Flux.2
    prompt_syntax:
      grammar: asteria-prompt-v1
      features: []
    dependency_ids:
      - flux2-qwen3-8b
      - flux2-vae
    model_slots:
      - id: diffusion_model
        label: Flux.2 Transformer
        type: checkpoint
        required: true
      - id: text_encoder
        label: Flux.2 Text Encoder
        type: text_encoder
        required: true
      - id: vae
        label: Flux.2 VAE
        type: vae
        required: true
    setting_groups:
      - base_generation
      - flux_runtime
      - hires_fix
